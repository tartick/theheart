<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE HEART — Visualizer</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Bebas Neue', sans-serif;
  }
  canvas {
    display: block;
  }
  #ui {
    position: fixed;
    bottom: 24px;
    display: flex;
    gap: 12px;
    z-index: 10;
  }
  button {
    background: rgba(255,255,255,0.08);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.25);
    padding: 10px 22px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 15px;
    letter-spacing: 2px;
    cursor: pointer;
    border-radius: 4px;
    transition: background 0.2s;
  }
  button:hover { background: rgba(255,255,255,0.18); }
  button.active { background: rgba(220,80,80,0.4); border-color: rgba(220,80,80,0.7); }
  #status {
    position: fixed;
    top: 20px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.35);
  }
</style>
</head>
<body>
<div id="status">CLICK "START MIC" TO BEGIN</div>
<canvas id="c"></canvas>
<div id="ui">
  <button id="micBtn">START MIC</button>
  <button id="modeBtn">◈ MESH</button>
  <button id="recBtn" style="display:none">● REC</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const micBtn = document.getElementById('micBtn');
const modeBtn = document.getElementById('modeBtn');
const recBtn = document.getElementById('recBtn');
const statusEl = document.getElementById('status');

let mode = 'particle';
modeBtn.addEventListener('click', () => {
  mode = mode === 'particle' ? 'mesh' : 'particle';
  modeBtn.textContent = mode === 'particle' ? '◈ MESH' : '◈ PARTICLE';
  modeBtn.classList.toggle('active', mode === 'mesh');
});

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Audio
let analyser, dataArray, freqArray, audioCtx;
let micActive = false;

async function startMic() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const source = audioCtx.createMediaStreamSource(stream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 1024;
  analyser.smoothingTimeConstant = 0.8;
  source.connect(analyser);
  dataArray = new Uint8Array(analyser.frequencyBinCount);
  freqArray = new Uint8Array(analyser.frequencyBinCount);
  micActive = true;
  micBtn.textContent = 'MIC ON';
  micBtn.classList.add('active');
  statusEl.textContent = 'LISTENING';
}

micBtn.addEventListener('click', () => {
  if (!micActive) startMic().catch(e => { statusEl.textContent = 'MIC DENIED'; });
});

// Smooth lub-dub heartbeat at 68 BPM
let hbSmoothed = 0;
function heartbeatPulse() {
  const period = 60 / 68;
  const phase = (t % period) / period;
  const lub = Math.exp(-phase * 14) * Math.max(0, 1 - phase * 10);
  const dubPhase = Math.max(0, phase - 0.2);
  const dub = 0.4 * Math.exp(-dubPhase * 18) * Math.max(0, 1 - dubPhase * 14);
  const raw = Math.max(0, lub + dub);
  hbSmoothed += (raw - hbSmoothed) * 0.12; // ease toward raw value
  return hbSmoothed;
}

function getAudioData() {
  if (!micActive || !analyser) {
    const hb = heartbeatPulse();
    return { waveform: null, freq: null, volume: hb * 0.2, bass: hb * 0.35, mid: hb * 0.08, treble: 0 };
  }
  analyser.getByteTimeDomainData(dataArray);
  analyser.getByteFrequencyData(freqArray);
  let sum = 0;
  for (let i = 0; i < dataArray.length; i++) sum += Math.abs(dataArray[i] - 128);
  const volume = sum / dataArray.length / 128;

  const bassEnd = Math.floor(freqArray.length * 0.05);
  const midEnd = Math.floor(freqArray.length * 0.3);
  let bass = 0, mid = 0, treble = 0;
  for (let i = 0; i < bassEnd; i++) bass += freqArray[i];
  for (let i = bassEnd; i < midEnd; i++) mid += freqArray[i];
  for (let i = midEnd; i < freqArray.length; i++) treble += freqArray[i];
  bass = bass / bassEnd / 255;
  mid = mid / (midEnd - bassEnd) / 255;
  treble = treble / (freqArray.length - midEnd) / 255;

  return { waveform: dataArray, freq: freqArray, volume, bass, mid, treble };
}

// Uniform lat/long grid — shared by both particle and mesh modes
const LAT_BANDS = 55, LON_SEGS = 80;
const grid = [];
for (let i = 0; i <= LAT_BANDS; i++) {
  const theta = (i / LAT_BANDS) * Math.PI;
  grid[i] = [];
  for (let j = 0; j < LON_SEGS; j++) {
    const phi = (j / LON_SEGS) * Math.PI * 2;
    grid[i][j] = { theta, phi, phase: Math.random() * Math.PI * 2, speed: 0.3 + Math.random() * 0.7 };
  }
}
const dots = grid.flat();

let t = 0;

// Colors matched to key art: orange-yellow top → coral/hot-pink mid → deep purple bottom
function sphereColor(theta, phi, t, bass, mid) {
  const ny = Math.cos(theta);
  const nx = Math.sin(theta) * Math.cos(phi);
  const nz = Math.sin(theta) * Math.sin(phi);

  const audioShift = bass * 18 + mid * 10;
  const angle = (Math.atan2(ny + 0.3, Math.sqrt(nx*nx + nz*nz)) / Math.PI + 0.5 + t * 0.035) % 1;

  let r, g, b;
  if (angle < 0.2) {
    // orange-yellow → orange
    const f = angle / 0.2;
    r = 255; g = Math.round(155 - f * 85); b = 0;
  } else if (angle < 0.38) {
    // orange → hot coral/red
    const f = (angle - 0.2) / 0.18;
    r = 255; g = Math.round(70 - f * 55); b = Math.round(f * 50);
  } else if (angle < 0.55) {
    // coral → hot pink/magenta
    const f = (angle - 0.38) / 0.17;
    r = 255; g = Math.round(15 - f * 5); b = Math.round(50 + f * 130);
  } else if (angle < 0.75) {
    // magenta → violet
    const f = (angle - 0.55) / 0.2;
    r = Math.round(255 - f * 160); g = Math.round(10); b = Math.round(180 + f * 60);
  } else {
    // violet → deep indigo
    const f = (angle - 0.75) / 0.25;
    r = Math.round(95 - f * 50); g = Math.round(10); b = Math.round(240 - f * 70);
  }

  r = Math.min(255, r + audioShift);
  return `rgb(${r},${g},${b})`;
}

function drawSphere(cx, cy, radius, bass, mid, treble, volume) {
  const sorted = dots.map(d => {
    const p = projectDot(d, radius, bass, mid);
    return { sx: cx + p.sx, sy: cy + p.sy, depth: p.depth, theta: d.theta, phi: d.phi };
  });

  sorted.sort((a, b) => a.depth - b.depth);

  for (const d of sorted) {
    const dotSize = (0.8 + d.depth * 1.4) * (1 + bass * 0.5 + volume * 0.3);
    const alpha = 0.4 + d.depth * 0.6;
    const col = sphereColor(d.theta, d.phi, t, bass, mid);

    ctx.globalAlpha = alpha;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(d.sx, d.sy, Math.max(0.5, dotSize), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// Shared projection — used by both mesh and particle modes
function projectDot(d, radius, bass, mid) {
  const cosY = Math.cos(t * 0.15), sinY = Math.sin(t * 0.15);

  // Rounder orb matching updated key art — subtle surface texture only
  const ripple = 0.06 * Math.sin(3 * d.theta) * Math.sin(3 * d.phi)
               + 0.03 * Math.sin(5 * d.theta) * Math.cos(5 * d.phi);

  const baseShape = 1 + ripple;

  const perturbR = radius * baseShape
    * (1 + bass * 0.28 * Math.sin(d.theta * 3 + t * 2 + d.phase)
         + mid  * 0.14 * Math.cos(d.phi  * 2 + t * 1.5));
  const r = perturbR * (1 + 0.04 * Math.sin(d.theta * 6 + t * d.speed));

  const x3 = r * Math.sin(d.theta) * Math.cos(d.phi + t * 0.12);
  const y3 = r * Math.cos(d.theta);
  const z3 = r * Math.sin(d.theta) * Math.sin(d.phi + t * 0.12);

  const rx = x3 * cosY - z3 * sinY;
  const rz = x3 * sinY + z3 * cosY;
  const sc = 600 / (600 - rz);

  return { sx: rx * sc, sy: -y3 * sc, depth: (rz + r) / (2 * r) };
}

function drawMesh(cx, cy, radius, bass, mid, treble, volume) {
  // Project all grid points — O(n) no sort, no shadow
  const proj = grid.map(band => band.map(d => {
    const p = projectDot(d, radius, bass, mid);
    return { sx: cx + p.sx, sy: cy + p.sy, depth: p.depth, theta: d.theta, phi: d.phi };
  }));

  // — Latitude rings: one closed polyline per ring (56 draw calls total)
  for (let i = 0; i <= LAT_BANDS; i++) {
    const ring    = proj[i];
    const avgD    = ring.reduce((s, p) => s + p.depth, 0) / LON_SEGS;
    const theta   = grid[i][0].theta;
    const col     = sphereColor(theta, 0, t, bass, mid);

    // Glow pass
    ctx.globalAlpha = 0.06 + avgD * 0.18;
    ctx.strokeStyle  = col;
    ctx.lineWidth    = 1.8 + avgD * 1.6;
    ctx.beginPath();
    ring.forEach((p, j) => j === 0 ? ctx.moveTo(p.sx, p.sy) : ctx.lineTo(p.sx, p.sy));
    ctx.closePath();
    ctx.stroke();

    // Crisp pass
    ctx.globalAlpha = 0.18 + avgD * 0.65;
    ctx.lineWidth   = 0.4 + avgD * 0.5;
    ctx.beginPath();
    ring.forEach((p, j) => j === 0 ? ctx.moveTo(p.sx, p.sy) : ctx.lineTo(p.sx, p.sy));
    ctx.closePath();
    ctx.stroke();
  }

  // — Meridians: one open polyline per meridian (80 draw calls total)
  for (let j = 0; j < LON_SEGS; j++) {
    const col   = sphereColor(Math.PI / 2, grid[0][j].phi, t, bass, mid);
    const avgD  = grid.reduce((s, _, i) => s + proj[i][j].depth, 0) / (LAT_BANDS + 1);

    ctx.globalAlpha = 0.08 + avgD * 0.35;
    ctx.strokeStyle  = col;
    ctx.lineWidth    = 0.3 + avgD * 0.4;
    ctx.beginPath();
    for (let i = 0; i <= LAT_BANDS; i++) {
      const p = proj[i][j];
      i === 0 ? ctx.moveTo(p.sx, p.sy) : ctx.lineTo(p.sx, p.sy);
    }
    ctx.stroke();
  }

  ctx.globalAlpha = 1;
}

function drawWaveform(waveform, volume, bass) {
  const ROWS = 22;
  const centerY = H / 2 + H * 0.05;
  const amp = (waveform ? 70 + bass * 110 + volume * 50 : 38 + bass * 60) ;
  const ribbonDepth = H * 0.13;

  function waveY(phase, row) {
    if (waveform) {
      const idx = Math.floor(phase * (waveform.length - 1));
      return (waveform[idx] - 128) / 128;
    }
    // Procedural: layered sines for organic EKG-like idle shape
    return Math.sin(phase * Math.PI * 10 + t * 1.8) * 0.45
         + Math.sin(phase * Math.PI * 5  + t * 1.1 + row * 0.18) * 0.30
         + Math.sin(phase * Math.PI * 20 + t * 2.6) * 0.15
         + Math.sin(phase * Math.PI * 3  + t * 0.7) * 0.10;
  }

  const COLS = 180;
  for (let row = 0; row < ROWS; row++) {
    const rowT  = row / (ROWS - 1);                     // 0 (back) → 1 (front)
    const z     = (rowT - 0.5) * ribbonDepth;
    const persp = 550 / (550 - z);
    const yBase = centerY + (rowT - 0.5) * ribbonDepth * 0.55 * persp;
    const alpha = 0.07 + rowT * 0.55;
    const lw    = 0.3 + rowT * 0.8;

    // Glow pass (thick, dim)
    ctx.strokeStyle = `rgba(140, 40, 255, ${alpha * 0.4})`;
    ctx.lineWidth   = lw + 2.5;
    ctx.beginPath();
    for (let c = 0; c <= COLS; c++) {
      const phase = c / COLS;
      const x = phase * W;
      const y = yBase + waveY(phase, row) * amp * persp;
      c === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();

    // Crisp pass
    ctx.strokeStyle = `rgba(175, 60, 255, ${alpha})`;
    ctx.lineWidth   = lw;
    ctx.beginPath();
    for (let c = 0; c <= COLS; c++) {
      const phase = c / COLS;
      const x = phase * W;
      const y = yBase + waveY(phase, row) * amp * persp;
      c === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}

function drawText() {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Hot pink gradient matching new key art
  const gTHE = ctx.createLinearGradient(0, 0, 0, H * 0.22);
  gTHE.addColorStop(0, '#FF1060');
  gTHE.addColorStop(1, '#FF5020');

  const gHEART = ctx.createLinearGradient(0, H * 0.78, 0, H);
  gHEART.addColorStop(0, '#FF5020');
  gHEART.addColorStop(1, '#FF1060');

  // "THE" — top of screen
  const szThe = Math.round(Math.min(W * 0.20, H * 0.16));
  ctx.font = `bold ${szThe}px 'Bebas Neue', sans-serif`;
  ctx.fillStyle = gTHE;
  ctx.fillText('THE', W / 2, H * 0.11);

  // "HEART" — bottom of screen
  const szHeart = Math.round(Math.min(W * 0.26, H * 0.18));
  ctx.font = `bold ${szHeart}px 'Bebas Neue', sans-serif`;
  ctx.fillStyle = gHEART;
  ctx.fillText('HEART', W / 2, H * 0.90);

  ctx.restore();
}

// FFmpeg lazy loader — single-threaded core, no COOP/COEP headers needed
let _ffmpeg = null;
async function getFFmpeg() {
  if (_ffmpeg) return _ffmpeg;
  const { FFmpeg } = await import('https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js');
  const { fetchFile } = await import('https://unpkg.com/@ffmpeg/util@0.12.1/dist/esm/index.js');
  const ff = new FFmpeg();
  await ff.load({
    coreURL: 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js',
  });
  _ffmpeg = { ff, fetchFile };
  return _ffmpeg;
}

// Recording
let mediaRecorder = null;
let recordedChunks = [];
let isRecording = false;

recBtn.addEventListener('click', () => {
  if (!isRecording) {
    recordedChunks = [];
    const stream = canvas.captureStream(30);
    const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
      ? 'video/webm;codecs=vp9' : 'video/webm';
    mediaRecorder = new MediaRecorder(stream, { mimeType });
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      statusEl.textContent = 'CONVERTING TO MP4…';
      recBtn.disabled = true;
      try {
        const webmBlob = new Blob(recordedChunks, { type: 'video/webm' });
        const { ff, fetchFile } = await getFFmpeg();
        await ff.writeFile('in.webm', await fetchFile(webmBlob));
        await ff.exec(['-i', 'in.webm', '-c:v', 'libx264', '-preset', 'ultrafast', '-crf', '23', '-movflags', '+faststart', 'out.mp4']);
        const data = await ff.readFile('out.mp4');
        const mp4Blob = new Blob([data.buffer], { type: 'video/mp4' });
        const url = URL.createObjectURL(mp4Blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'the-heart-visualizer.mp4'; a.click();
        URL.revokeObjectURL(url);
      } catch (err) {
        console.error('MP4 conversion failed, downloading webm', err);
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'the-heart-visualizer.webm'; a.click();
        URL.revokeObjectURL(url);
      }
      recBtn.disabled = false;
      statusEl.textContent = micActive ? 'LISTENING' : 'CLICK "START MIC" TO BEGIN';
    };
    mediaRecorder.start();
    isRecording = true;
    recBtn.textContent = '■ STOP';
    recBtn.classList.add('active');
  } else {
    mediaRecorder.stop();
    isRecording = false;
    recBtn.textContent = '● REC';
    recBtn.classList.remove('active');
  }
});

// Main loop
function draw() {
  requestAnimationFrame(draw);
  t += 0.016;

  const { waveform, volume, bass, mid, treble } = getAudioData();

  // Background with trail
  ctx.fillStyle = 'rgba(0, 0, 0, 0.88)';
  ctx.fillRect(0, 0, W, H);

  const radius = Math.min(W, H) * 0.27;
  const cx = W / 2, cy = H / 2 + H * 0.05;
  if (mode === 'mesh') {
    drawMesh(cx, cy, radius, bass, mid, treble, volume);
  } else {
    drawSphere(cx, cy, radius, bass, mid, treble, volume);
  }
  drawWaveform(waveform, volume, bass);
  drawText();
}

draw();
</script>
</body>
</html>
