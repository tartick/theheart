<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE HEART — Visualizer</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Bebas Neue', sans-serif;
  }
  canvas {
    display: block;
  }
  #ui {
    position: fixed;
    bottom: 24px;
    display: flex;
    gap: 12px;
    z-index: 10;
  }
  button {
    background: rgba(255,255,255,0.08);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.25);
    padding: 10px 22px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 15px;
    letter-spacing: 2px;
    cursor: pointer;
    border-radius: 4px;
    transition: background 0.2s;
  }
  button:hover { background: rgba(255,255,255,0.18); }
  button.active { background: rgba(220,80,80,0.4); border-color: rgba(220,80,80,0.7); }
  #status {
    position: fixed;
    top: 20px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.35);
  }
</style>
</head>
<body>
<div id="status">CLICK "START MIC" TO BEGIN</div>
<canvas id="c"></canvas>
<div id="ui">
  <button id="micBtn">START MIC</button>
  <button id="recBtn">● REC</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const micBtn = document.getElementById('micBtn');
const recBtn = document.getElementById('recBtn');
const statusEl = document.getElementById('status');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Audio
let analyser, dataArray, freqArray, audioCtx;
let micActive = false;

async function startMic() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const source = audioCtx.createMediaStreamSource(stream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 1024;
  analyser.smoothingTimeConstant = 0.8;
  source.connect(analyser);
  dataArray = new Uint8Array(analyser.frequencyBinCount);
  freqArray = new Uint8Array(analyser.frequencyBinCount);
  micActive = true;
  micBtn.textContent = 'MIC ON';
  micBtn.classList.add('active');
  statusEl.textContent = 'LISTENING';
}

micBtn.addEventListener('click', () => {
  if (!micActive) startMic().catch(e => { statusEl.textContent = 'MIC DENIED'; });
});

function getAudioData() {
  if (!micActive || !analyser) return { waveform: null, freq: null, volume: 0, bass: 0, mid: 0, treble: 0 };
  analyser.getByteTimeDomainData(dataArray);
  analyser.getByteFrequencyData(freqArray);
  let sum = 0;
  for (let i = 0; i < dataArray.length; i++) sum += Math.abs(dataArray[i] - 128);
  const volume = sum / dataArray.length / 128;

  const bassEnd = Math.floor(freqArray.length * 0.05);
  const midEnd = Math.floor(freqArray.length * 0.3);
  let bass = 0, mid = 0, treble = 0;
  for (let i = 0; i < bassEnd; i++) bass += freqArray[i];
  for (let i = bassEnd; i < midEnd; i++) mid += freqArray[i];
  for (let i = midEnd; i < freqArray.length; i++) treble += freqArray[i];
  bass = bass / bassEnd / 255;
  mid = mid / (midEnd - bassEnd) / 255;
  treble = treble / (freqArray.length - midEnd) / 255;

  return { waveform: dataArray, freq: freqArray, volume, bass, mid, treble };
}

// Lat/long grid — creates visible surface bands like the reference
const dots = [];
const LAT_BANDS = 48;
for (let i = 1; i < LAT_BANDS; i++) {
  const theta = (i / LAT_BANDS) * Math.PI;
  const ringCount = Math.max(4, Math.round(Math.sin(theta) * 96));
  for (let j = 0; j < ringCount; j++) {
    const phi = (j / ringCount) * Math.PI * 2;
    dots.push({ theta, phi, phase: Math.random() * Math.PI * 2, speed: 0.3 + Math.random() * 0.7 });
  }
}

let t = 0;

// Color helpers
function sphereColor(theta, phi, t, bass, mid) {
  // Map position to gradient: orange top → pink middle → purple/blue bottom+sides
  const ny = Math.cos(theta); // -1 to 1
  const nx = Math.sin(theta) * Math.cos(phi);
  const nz = Math.sin(theta) * Math.sin(phi);

  // Animated hue shift based on audio
  const audioShift = (bass * 30 + mid * 20);
  const angle = (Math.atan2(ny + 0.5, Math.sqrt(nx*nx + nz*nz)) / Math.PI + 0.5 + t * 0.04) % 1;

  // Color stops: orange → red/pink → magenta → purple → deep blue
  let r, g, b;
  if (angle < 0.25) {
    // orange to red
    const f = angle / 0.25;
    r = 255; g = Math.round(165 - f * 130); b = Math.round(f * 60);
  } else if (angle < 0.5) {
    // red to magenta/pink
    const f = (angle - 0.25) / 0.25;
    r = 255; g = Math.round(35 + f * 10); b = Math.round(60 + f * 140);
  } else if (angle < 0.75) {
    // magenta to purple
    const f = (angle - 0.5) / 0.25;
    r = Math.round(255 - f * 130); g = Math.round(45 - f * 15); b = Math.round(200 + f * 55);
  } else {
    // purple to deep indigo
    const f = (angle - 0.75) / 0.25;
    r = Math.round(125 - f * 60); g = Math.round(30); b = Math.round(255 - f * 60);
  }

  r = Math.min(255, r + audioShift);
  return `rgb(${r},${g},${b})`;
}

function drawSphere(cx, cy, radius, bass, mid, treble, volume) {
  const sorted = dots.map(d => {
    // Organic base shape: two side lobes + vertical pinch = brain/heart abstraction
    const baseShape = 1
      + 0.28 * Math.sin(d.theta) * Math.cos(2 * d.phi)          // two side lobes
      + 0.12 * Math.cos(2 * d.theta)                             // vertical flattening
      + 0.09 * Math.sin(3 * d.theta) * Math.sin(3 * d.phi)      // surface ripple
      + 0.06 * Math.cos(d.theta * 4) * Math.cos(d.phi * 2);     // fine texture

    const perturbR = radius * baseShape
      * (1 + bass * 0.38 * Math.sin(d.theta * 3 + t * 2 + d.phase)
           + mid * 0.22 * Math.cos(d.phi * 2 + t * 1.5));
    const noiseR = perturbR * (1 + 0.07 * Math.sin(d.theta * 6 + t * d.speed));

    const x3 = noiseR * Math.sin(d.theta) * Math.cos(d.phi + t * 0.12);
    const y3 = noiseR * Math.cos(d.theta);
    const z3 = noiseR * Math.sin(d.theta) * Math.sin(d.phi + t * 0.12);

    // Simple rotation around Y
    const cosY = Math.cos(t * 0.15);
    const sinY = Math.sin(t * 0.15);
    const rx = x3 * cosY - z3 * sinY;
    const rz = x3 * sinY + z3 * cosY;

    const scale = 600 / (600 - rz);
    const sx = cx + rx * scale;
    const sy = cy - y3 * scale;
    const depth = (rz + noiseR) / (2 * noiseR); // 0 back, 1 front

    return { sx, sy, depth, theta: d.theta, phi: d.phi, r: noiseR };
  });

  sorted.sort((a, b) => a.depth - b.depth);

  for (const d of sorted) {
    const dotSize = (0.8 + d.depth * 1.4) * (1 + bass * 0.5 + volume * 0.3);
    const alpha = 0.4 + d.depth * 0.6;
    const col = sphereColor(d.theta, d.phi, t, bass, mid);

    ctx.globalAlpha = alpha;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(d.sx, d.sy, Math.max(0.5, dotSize), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawWaveform(waveform, volume, bass) {
  if (!waveform) {
    // idle sine
    ctx.save();
    ctx.strokeStyle = 'rgba(140, 60, 220, 0.5)';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#9933ff';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    const y = H / 2;
    for (let x = 0; x < W; x++) {
      const v = Math.sin((x / W) * Math.PI * 6 + t * 2) * 15;
      x === 0 ? ctx.moveTo(x, y + v) : ctx.lineTo(x, y + v);
    }
    ctx.stroke();
    ctx.restore();
    return;
  }

  const sliceW = W / waveform.length;
  const amp = 80 + bass * 120 + volume * 60;
  const midY = H / 2;

  // Draw mirrored top/bottom glow
  for (let pass = 0; pass < 2; pass++) {
    ctx.save();
    ctx.strokeStyle = pass === 0 ? 'rgba(180, 80, 255, 0.35)' : 'rgba(220, 100, 255, 0.85)';
    ctx.lineWidth = pass === 0 ? 6 : 2;
    ctx.shadowColor = '#cc44ff';
    ctx.shadowBlur = pass === 0 ? 25 : 10;
    ctx.beginPath();
    for (let i = 0; i < waveform.length; i++) {
      const v = (waveform[i] - 128) / 128;
      const x = i * sliceW;
      const y = midY + v * amp;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();
  }
}

function drawText(volume, bass) {
  const pulse = 1 + bass * 0.05 + volume * 0.03;
  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.scale(pulse, pulse);

  // Glow
  ctx.font = `bold ${Math.round(W * 0.22)}px 'Bebas Neue', sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = `rgba(255, 80, 150, ${0.4 + bass * 0.5})`;
  ctx.shadowBlur = 40 + bass * 60;
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillText('THE', 0, -H * 0.095);
  ctx.fillText('HEART', 0, H * 0.07);

  // Crisp white
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#ffffff';
  ctx.fillText('THE', 0, -H * 0.095);
  ctx.fillText('HEART', 0, H * 0.07);

  ctx.restore();
}

// Recording
let mediaRecorder = null;
let recordedChunks = [];
let isRecording = false;

recBtn.addEventListener('click', () => {
  if (!isRecording) {
    recordedChunks = [];
    const stream = canvas.captureStream(30);
    mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'the-heart-visualizer.webm'; a.click();
      URL.revokeObjectURL(url);
    };
    mediaRecorder.start();
    isRecording = true;
    recBtn.textContent = '■ STOP';
    recBtn.classList.add('active');
  } else {
    mediaRecorder.stop();
    isRecording = false;
    recBtn.textContent = '● REC';
    recBtn.classList.remove('active');
  }
});

// Main loop
function draw() {
  requestAnimationFrame(draw);
  t += 0.016;

  const { waveform, volume, bass, mid, treble } = getAudioData();

  // Background with trail
  ctx.fillStyle = 'rgba(0, 0, 0, 0.88)';
  ctx.fillRect(0, 0, W, H);

  const radius = Math.min(W, H) * 0.28;
  drawSphere(W / 2, H / 2, radius, bass, mid, treble, volume);
  drawWaveform(waveform, volume, bass);
  drawText(volume, bass);
}

draw();
</script>
</body>
</html>
